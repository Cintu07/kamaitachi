[package]
name = "hayate-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[[bin]]
name = "http"
path = "fuzz_targets/http.rs"
test = false
doc = false

[[bin]]
name = "sse"
path = "fuzz_targets/sse.rs"
test = false
doc = false

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false

[[bin]]
name = "records"
path = "fuzz_targets/records.rs"
test = false
doc = false

[workspace]
members = ["."]
