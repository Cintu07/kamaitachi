<!doctype html>
<html>
<head>
<title>New tab</title>
<style>
html { background: transparent; color: #ecebe6; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; }
body { margin: 0; }
main { height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; max-width: 900px; margin: 0 auto; padding: 0 32px 34px; }
.label { font-family: "Cascadia Mono", Consolas, monospace; font-size: 11px; color: #ffd3a8; margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.grid a { display: block; background: rgba(8, 8, 12, 0.72); border: 1px solid rgba(255, 255, 255, 0.07); border-top-color: rgba(255, 255, 255, 0.14); border-bottom-color: rgba(0, 0, 0, 0.8); border-radius: 6px; padding: 11px 12px 10px; color: #ecebe6; text-decoration: none; }
.grid a span { display: block; font-family: "Cascadia Mono", Consolas, monospace; font-size: 10px; color: #ff8a4a; }
.grid a b { display: block; font-size: 13.5px; font-weight: 600; margin-top: 6px; }
.keys { margin: 14px 0 0; font-family: "Cascadia Mono", Consolas, monospace; color: #8b8a85; font-size: 10.5px; }
.keys b { color: #c9a27e; font-weight: 500; }
</style>
</head>
<body>
<main></main>
</body>
</html>
