[package]
name = "kamaitachi"
version = "0.1.0"
edition = "2024"
description = "a light browser with its own engine, plus hayate, a terminal client for x, youtube, claude and chatgpt"
license = "MIT"
build = "build.rs"

# the engine and both programs share one library; it kept the name it started with
[lib]
name = "hayate"
path = "src/lib.rs"

[[bin]]
name = "hayate"
path = "src/main.rs"

[[bin]]
name = "kamaitachi"
path = "src/bin/kamaitachi.rs"

# every dependency lists what it costs in the binary in DEPENDENCIES.md
[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
# already linked by rustls; used directly for pkce sha-256 and randomness
ring = "0.17"
# the ad blocker, kept in its own repo so other programs can use it
omamori = { git = "https://github.com/Cintu07/omamori", branch = "main" }

# everything below is the Windows side: the window browser, the terminal client and
# their system calls. The engine and networking above build for any target
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_System_Registry",
] }
# the window browser: direct3d 11 for pixels, directwrite for shaping, wic for image decoding
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
] }
windows-core = "0.62"
# full-engine tabs: the WebView2 (Chromium) runtime that ships with windows, loaded on first use
webview2-com = "0.39"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"   # unwind so the panic hook can restore the console
strip = true
debug = false

[profile.dev]
opt-level = 1

# for test renders while working: much less compile time and heat than the full release
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
